name: Generate Incident Reconstruction

on:
  push:
    paths:
      - ".github/workflows/generate-incident-reconstruction.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build challenge package
        run: python .github/scripts/generate_incident.py

      - name: Commit artifact
        shell: bash
        run: |
          rm .github/workflows/generate-incident-reconstruction.yml
          rm .github/scripts/generate_incident.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/files/reconstruct-the-incident/Northstar_Incident_Reconstruction.zip .github/workflows/generate-incident-reconstruction.yml .github/scripts/generate_incident.py
          git commit -m "Add Reconstruct the Incident challenge artifact"
          git push
