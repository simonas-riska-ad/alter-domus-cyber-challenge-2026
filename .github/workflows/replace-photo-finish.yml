name: Replace Photo Finish artifact

on:
  push:
    paths:
      - ".github/workflows/replace-photo-finish.yml"

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Download sharp source image
        shell: bash
        run: |
          curl -L --fail --retry 3             "https://images.unsplash.com/photo-1768508665014-7e567bf7fdb2?auto=format&fit=crop&fm=jpg&ixlib=rb-4.1.0&q=92&w=2400"             -o /tmp/source.jpg

      - name: Build final challenge artifact
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          from pathlib import Path

          source = Image.open("/tmp/source.jpg").convert("RGB")
          img = ImageOps.fit(source, (1600, 1000), method=Image.Resampling.LANCZOS)

          overlay = Image.new("RGBA", img.size, (0, 0, 0, 0))
          draw = ImageDraw.Draw(overlay)
          draw.rounded_rectangle((48, 48, 590, 168), radius=18, fill=(14, 24, 35, 205))

          title_font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 34)
          sub_font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 20)
          draw.text((78, 70), "NORTHSTAR GROWTH II", font=title_font, fill=(255,255,255,255))
          draw.text((80, 120), "INVESTOR EVENT · 2026", font=sub_font, fill=(224,229,235,255))

          img = Image.alpha_composite(img.convert("RGBA"), overlay).convert("RGB")

          exif = Image.Exif()
          exif[270] = "Northstar Growth II investor event. Internal media review flag: ADCTF{metadata_leaks_information}"
          exif[271] = "Northstar Events"
          exif[272] = "Event Media Camera"
          exif[305] = "Northstar Media Workflow 2.6"
          exif[306] = "2026:09:18 17:42:11"
          exif[315] = "Northstar Communications"
          exif[33432] = "Source photo: Filip Rankovic Grobgaard / Unsplash (free under Unsplash License)"

          target = Path("docs/files/photo-finish/Northstar_Investor_Event.jpg")
          img.save(target, "JPEG", quality=94, subsampling=0, optimize=True, exif=exif)

          check = Image.open(target)
          print("Final size:", check.size)
          print("ImageDescription:", check.getexif().get(270))
          print("Bytes:", target.stat().st_size)
          PY

      - name: Remove one-off workflow and commit replacement
        shell: bash
        run: |
          rm .github/workflows/replace-photo-finish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/files/photo-finish/Northstar_Investor_Event.jpg .github/workflows/replace-photo-finish.yml
          git commit -m "Replace Photo Finish artifact with sharp high-resolution version"
          git push
