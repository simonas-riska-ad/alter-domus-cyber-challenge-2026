name: Refresh Photo Finish artifact

on:
  push:
    paths:
      - ".github/workflows/refresh-photo-finish.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Improve image quality and replace EXIF clue
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageEnhance, ImageFilter
          from pathlib import Path

          path = Path("docs/files/photo-finish/Northstar_Investor_Event.jpg")
          img = Image.open(path).convert("RGB")

          # Upscale the earlier aggressively compressed copy and restore perceived crispness.
          img = img.resize((1536, 1024), Image.Resampling.LANCZOS)
          img = ImageEnhance.Contrast(img).enhance(1.03)
          img = ImageEnhance.Sharpness(img).enhance(1.35)
          img = img.filter(ImageFilter.UnsharpMask(radius=1.15, percent=145, threshold=2))

          exif = Image.Exif()
          exif[270] = "Northstar Growth II investor event. Internal media review flag: ADCTF{metadata_leaks_information}"
          exif[271] = "Northstar Events"
          exif[272] = "Event Media Camera"
          exif[305] = "Northstar Media Workflow 2.6"
          exif[306] = "2026:09:18 17:42:11"
          exif[315] = "Northstar Communications"
          exif[33432] = "Copyright 2026 Northstar Growth Partners (fictional)"

          img.save(path, "JPEG", quality=96, subsampling=0, optimize=True, exif=exif)
          PY

      - name: Remove one-off workflow and commit replacement
        shell: bash
        run: |
          rm .github/workflows/refresh-photo-finish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/files/photo-finish/Northstar_Investor_Event.jpg .github/workflows/refresh-photo-finish.yml
          git commit -m "Improve Photo Finish artifact and update EXIF flag"
          git push
