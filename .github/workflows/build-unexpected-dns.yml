name: Build Unexpected DNS artifact

on:
  push:
    paths:
      - ".github/workflows/build-unexpected-dns.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate synthetic DNS PCAP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import random, socket, struct

          out = Path("docs/files/unexpected-dns/Northstar_Endpoint_DNS_Capture.pcap")
          out.parent.mkdir(parents=True, exist_ok=True)

          rng = random.Random(170926)

          def checksum(data):
              if len(data) % 2:
                  data += b"\x00"
              s = sum(struct.unpack(f"!{len(data)//2}H", data))
              s = (s >> 16) + (s & 0xffff)
              s += s >> 16
              return (~s) & 0xffff

          def encode_qname(name):
              return b"".join(bytes([len(p)]) + p.encode("ascii")
                              for p in name.rstrip(".").split(".")) + b"\x00"

          def dns_query(txid, qname):
              return struct.pack("!HHHHHH", txid, 0x0100, 1, 0, 0, 0) + encode_qname(qname) + struct.pack("!HH", 1, 1)

          def dns_response(txid, qname, ip):
              q = encode_qname(qname) + struct.pack("!HH", 1, 1)
              ans = struct.pack("!HHHLH", 0xC00C, 1, 1, 60, 4) + socket.inet_aton(ip)
              return struct.pack("!HHHHHH", txid, 0x8180, 1, 1, 0, 0) + q + ans

          def packet(src_ip, dst_ip, src_port, dst_port, payload, ident):
              udp_len = 8 + len(payload)
              udp = struct.pack("!HHHH", src_port, dst_port, udp_len, 0) + payload
              iph = struct.pack("!BBHHHBBH4s4s", 0x45, 0, 20+len(udp), ident, 0x4000,
                                64, 17, 0, socket.inet_aton(src_ip), socket.inet_aton(dst_ip))
              c = checksum(iph)
              iph = struct.pack("!BBHHHBBH4s4s", 0x45, 0, 20+len(udp), ident, 0x4000,
                                64, 17, c, socket.inet_aton(src_ip), socket.inet_aton(dst_ip))
              eth = bytes.fromhex("00112233445566778899aabb0800")
              return eth + iph + udp

          client = "192.0.2.45"
          resolver = "192.0.2.53"
          normal = [
              "portal.northstar.example","updates.vendor.example","login.identity.example",
              "docs.northstar.example","time.service.example","cdn.assets.example",
              "api.reporting.example","mail.gateway.example",
          ]

          secret = b"ADCTF{dns_queries_can_carry_data}"
          encoded = secret.hex()
          chunks = [encoded[i:i+14] for i in range(0, len(encoded), 14)]
          suspicious_domain = "telemetry-sync.example"

          records = []
          base = 1790143200.0
          ident = 1000

          def add(ts, pkt):
              records.append((ts, pkt))

          for i in range(48):
              domain = rng.choice(normal)
              ts = base + i * rng.uniform(2.2, 5.8)
              tx = 0x4200 + i
              sport = rng.randint(40000, 62000)
              add(ts, packet(client, resolver, sport, 53, dns_query(tx, domain), ident)); ident += 1
              add(ts + rng.uniform(.02,.12), packet(resolver, client, 53, sport,
                  dns_response(tx, domain, f"198.51.100.{rng.randint(10,220)}"), ident)); ident += 1

          for idx, chunk in enumerate(chunks):
              ts = base + 70 + idx * 7.3
              tx = 0x5100 + idx
              sport = 53000 + idx
              qname = f"{chunk}.{suspicious_domain}"
              add(ts, packet(client, resolver, sport, 53, dns_query(tx, qname), ident)); ident += 1
              add(ts+.05, packet(resolver, client, 53, sport,
                  dns_response(tx, qname, "203.0.113.88"), ident)); ident += 1

          for i in range(20):
              domain = rng.choice(normal)
              ts = base + 200 + i * rng.uniform(2.0, 5.0)
              tx = 0x6200 + i
              sport = rng.randint(40000, 62000)
              add(ts, packet(client, resolver, sport, 53, dns_query(tx, domain), ident)); ident += 1
              add(ts + rng.uniform(.02,.10), packet(resolver, client, 53, sport,
                  dns_response(tx, domain, f"198.51.100.{rng.randint(10,220)}"), ident)); ident += 1

          records.sort(key=lambda x: x[0])

          with out.open("wb") as f:
              f.write(struct.pack("<IHHIIII", 0xA1B2C3D4, 2, 4, 0, 0, 65535, 1))
              for ts, pkt in records:
                  sec = int(ts)
                  usec = int((ts-sec)*1_000_000)
                  f.write(struct.pack("<IIII", sec, usec, len(pkt), len(pkt)))
                  f.write(pkt)

          data = out.read_bytes()
          assert data[:4] == bytes.fromhex("d4c3b2a1")
          for chunk in chunks:
              assert chunk.encode() in data
          print("Created", out, out.stat().st_size, "bytes,", len(records), "packets")
          print("Verified suspicious query sequence for", suspicious_domain)
          PY

      - name: Remove one-off workflow and commit artifact
        shell: bash
        run: |
          rm .github/workflows/build-unexpected-dns.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/files/unexpected-dns/Northstar_Endpoint_DNS_Capture.pcap .github/workflows/build-unexpected-dns.yml
          git commit -m "Add Unexpected DNS challenge artifact"
          git push
