<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a9b97"/>
      <stop offset="100%" stop-color="#c7c7c1"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f4248"/>
      <stop offset="100%" stop-color="#2b2d31"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#1d1f22"/>
  <rect y="150" width="1600" height="540" fill="url(#wall)"/>
  <rect y="690" width="1600" height="310" fill="url(#floor)"/>

  <!-- ceiling lights -->
  <g opacity="0.93" fill="#eeede4">
    <polygon points="-120,0 -55,0 110,150 40,150"/>
    <polygon points="120,0 185,0 350,150 280,150"/>
    <polygon points="360,0 425,0 590,150 520,150"/>
    <polygon points="600,0 665,0 830,150 760,150"/>
    <polygon points="840,0 905,0 1070,150 1000,150"/>
    <polygon points="1080,0 1145,0 1310,150 1240,150"/>
    <polygon points="1320,0 1385,0 1550,150 1480,150"/>
  </g>

  <!-- platform doors -->
  <g stroke="#747980" stroke-width="4">
    <g fill="#202328">
      <rect x="70" y="390" width="205" height="300"/>
      <rect x="310" y="390" width="205" height="300"/>
      <rect x="550" y="390" width="205" height="300"/>
      <rect x="790" y="390" width="205" height="300"/>
      <rect x="1030" y="390" width="205" height="300"/>
      <rect x="1270" y="390" width="205" height="300"/>
    </g>
    <g fill="#b9c3c7" stroke="none">
      <rect x="92" y="420" width="160" height="205"/>
      <rect x="332" y="420" width="160" height="205"/>
      <rect x="572" y="420" width="160" height="205"/>
      <rect x="812" y="420" width="160" height="205"/>
      <rect x="1052" y="420" width="160" height="205"/>
      <rect x="1292" y="420" width="160" height="205"/>
    </g>
  </g>

  <!-- main station sign -->
  <g filter="url(#shadow)">
    <rect x="320" y="195" width="960" height="160" rx="14" fill="#17181a"/>
    <rect x="515" y="218" width="725" height="112" rx="6" fill="#a1445d"/>
    <circle cx="385" cy="250" r="36" fill="#c87a36"/>
    <circle cx="467" cy="250" r="36" fill="#4473b2"/>
    <text x="385" y="263" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="35">M3</text>
    <text x="467" y="263" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="35">M4</text>
    <text x="555" y="292" fill="white" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="64">Rådhuspladsen</text>
  </g>

  <!-- direction panel -->
  <g filter="url(#shadow)">
    <rect x="390" y="410" width="820" height="104" rx="9" fill="#efefeb"/>
    <text x="455" y="474" fill="#252525" font-family="Arial, Helvetica, sans-serif" font-size="35">M3  ←</text>
    <text x="655" y="474" fill="#252525" font-family="Arial, Helvetica, sans-serif" font-size="35">M4  →</text>
    <text x="910" y="474" fill="#252525" font-family="Arial, Helvetica, sans-serif" font-size="35">Exit  ↑</text>
  </g>

  <!-- bench -->
  <rect x="140" y="785" width="480" height="48" rx="7" fill="#676b6e"/>
  <rect x="180" y="833" width="22" height="120" fill="#55585b"/>
  <rect x="555" y="833" width="22" height="120" fill="#55585b"/>

  <!-- subtle framing -->
  <rect x="18" y="18" width="1564" height="964" fill="none" stroke="#111214" stroke-width="36" opacity="0.24"/>
</svg>